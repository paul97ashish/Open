[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnhound"
version = "0.1.0"
description = "LLM-powered cybersecurity vulnerability harness that works with any open-source model via an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "vulnhound contributors" }]
keywords = ["security", "sast", "dast", "vulnerability", "llm", "scanner"]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "httpx>=0.24",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "jinja2>=3.0",
    "python-multipart>=0.0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vulnhound = "vulnhound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vulnhound = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
