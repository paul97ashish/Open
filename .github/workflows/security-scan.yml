  #       continue-on-error: true
  #       env:
  #         VULNHOUND_BASE_URL: http://localhost:11434/v1
  #         VULNHOUND_MODEL: qwen2.5-coder
  #       run: vulnhound scan code . --format sarif --output sast.sarif
